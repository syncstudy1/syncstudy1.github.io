
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/syncstudy-logo-full.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncStudy — Intelligent Focus & Study Optimization</title>

    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('&');

          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, l.pathname.lastIndexOf('/') + 1) +
              decoded +
              l.hash
          );
        }
      })(window.location);
    </script>

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('syncstudy-theme');
          var supportDark = window.matchMedia(
            '(prefers-color-scheme: dark)'
          ).matches;

          if (saved === 'dark' || (!saved && supportDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
