<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <radialGradient id="sparkle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD8C2" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#DCCBFF" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#A78BFA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7651E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sparkle-core" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="25%" stop-color="#FFD8C2"/>
      <stop offset="60%" stop-color="#DCCBFF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer aura glow -->
  <circle cx="24" cy="24" r="20" fill="url(#sparkle-glow)" opacity="0.7"/>
  <!-- 4-pointed primary star -->
  <path d="M24 2 C24 16 16 24 2 24 C16 24 24 32 24 46 C24 32 32 24 46 24 C32 24 24 16 24 2 Z" 
        fill="url(#sparkle-core)" 
        filter="url(#soft-glow)"/>
  <!-- Secondary inner accent star -->
  <path d="M24 10 C24 19 19 24 10 24 C19 24 24 29 24 38 C24 29 29 24 38 24 C29 24 24 19 24 10 Z" 
        fill="#FFFFFF" 
        opacity="0.9"/>
  <!-- Tiny center sparkle point -->
  <circle cx="24" cy="24" r="2.5" fill="#FFFDF9"/>
</svg>
